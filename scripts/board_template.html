     one row; flex-basis:100% keeps hero-right's own numbers right-aligned within its own full-
     width line rather than left-aligned by "space-between" having only one item on that line. */
  @media (max-width: 640px) {

  .hero-roas-label { font-size: 11.5px; opacity: 0.75; letter-spacing: 0.03em; margin-bottom: 2px; }

  /* CP zone: nests every AG column that really belongs to a campaign INSIDE that campaign's own
     colored container, instead of an independent campaign summary row sitting on top of an

  .zone-header {

    /* auto-fit (not auto-fill) collapses unused tracks to 0 width instead of reserving them, so a

  .listing-group { background: rgba(0,0,0,0.03); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }

  .opp-section {

  .opp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  /* 案A（2026-09-01, ふなとさん確認）: 画像が幅いっぱいの正方形で情報より目立ちすぎていた縦積み

  .opp-card { background: #ffffff; border-radius: 10px; padding: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.07); border-left: 4px solid #6b7fd7; display: flex; gap: 9px; }
  .opp-thumb-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: none; width: 56px; }

  .opp-rank { font-size: 9px; font-weight: 800; color: #6b7fd7; background: rgba(107,127,215,0.12); border-radius: 999px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
  .opp-body { flex: 1; min-width: 0; }

  .opp-title-text { font-size: 11px; line-height: 1.35; font-weight: 600; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .opp-chip .stat-label { font-weight: 500; font-size: 8.5px; color: #8a8f84; }
  .opp-reason { font-size: 9px; font-weight: 700; color: #a43a3a; background: rgba(214,69,69,0.08); display: inline-block; padding: 2px 6px; border-radius: 6px; }

<body>
<div id="board-root"></div>
<script>
(function(){
  const DATES = __DATES_JSON__;              // ["2026-04-30", ..., "2026-07-28"], oldest -> newest
  const products = __PRODUCTS_JSON__;         // each: {ag, title, id, img, cost:[], cv:[], value:[]} aligned to DATES
  const AG_ORDER = __AG_ORDER_JSON__;
  const AG_STATUS = __AG_STATUS_JSON__;        // display AG name -> "ENABLED"/"PAUSED", current account state
  const RAW_AG_GROUPS = __RAW_AG_GROUPS_JSON__; // [{raw, displays:[{ag, sublabel}]}] -- groups display AGs sharing one real Google Ads asset group (see generate_board.py)
  const RAW_AG_OF = Object.fromEntries(RAW_AG_GROUPS.flatMap(g => g.displays.map(d => [d.ag, g.raw]))); // display AG name -> raw Google Ads asset_group.name, derived from RAW_AG_GROUPS above
  const RAW_AG_CAMPAIGN = __RAW_AG_CAMPAIGN_JSON__; // raw asset_group.name -> campaign family ("Best-Selling"/"Second-Team"/"Gift-Scene"), derived live (see generate_board.py's fetch_raw_ag_campaigns) -- drives which CP zone each AG column nests under
  const OPPORTUNITY_PRODUCTS = __OPPORTUNITY_PRODUCTS_JSON__; // [{id,title,img,qty:[],revenue:[],adCost:[],reason}] aligned to DATES -- every product with real Shopify sales, for the "未広告・要検討" TOP10 (see generate_board.py's build_opportunity_products)
  const OPPORTUNITY_AD_COST_FLOOR = 100; // yen -- "実質ゼロ" cutoff for ad spend in the selected range, see build_opportunity_products
  const CAMPAIGN_ORDER = __CAMPAIGN_ORDER_JSON__; // preferred campaign column order
  const CAMPAIGN_COST = __CAMPAIGN_COST_JSON__;   // {family: [daily cost, aligned to DATES]} -- TRUE per-campaign totals, independent of product/AG classification
  const CAMPAIGN_VALUE = __CAMPAIGN_VALUE_JSON__; // {family: [daily conversion value]}
  const CAMPAIGN_CV = __CAMPAIGN_CV_JSON__;       // {family: [daily conversions]}
  const AG_COST = __AG_COST_JSON__;     // {display AG name: [daily cost, aligned to DATES]} -- TRUE per-asset_group totals (every surface: Shopping/Search/Display/YouTube/..., not just shopping_performance_view)
  const AG_VALUE = __AG_VALUE_JSON__;   // {display AG name: [daily conversion value]}
  const AG_CV = __AG_CV_JSON__;         // {display AG name: [daily conversions]}
  const ACCOUNT_COST = __ACCOUNT_COST_JSON__;   // true account-wide daily ad cost, aligned to DATES (every campaign, not just classified spend)
  const ACCOUNT_VALUE = __ACCOUNT_VALUE_JSON__; // true account-wide daily conversion value, aligned to DATES
  const SHOP_SALES = __SHOP_SALES_JSON__;       // whole store's own daily revenue (every order, every channel), aligned to DATES
  const STRUCTURE_WARNINGS = __STRUCTURE_WARNINGS_JSON__; // account structure the pipeline doesn't recognize (new campaigns/AGs/labels)
  const GENERATED_AT = "__GENERATED_AT__";
  const ROAS_GOOD = __ROAS_GOOD__;
  const ROAS_MID = __ROAS_MID__;
  const SHOPPING_RATIO_FLOOR = __SHOPPING_RATIO_FLOOR__; // below this, non-Shopping surfaces (Discover/Display/YouTube) are eating a concerning share of an AG's true spend -- see the shopping-ratio audit banner
  const DEFAULT_PRESET_DAYS = __DEFAULT_PRESET_DAYS__;
  const STALE_THRESHOLD_HOURS = 30; // daily updates run ~24h apart; flag if it's been noticeably longer

  function hoursSinceGenerated(){
    const m = GENERATED_AT.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
    if (!m) return null;
    const [y, mo, d, h, mi] = m.slice(1).map(Number);
    // GENERATED_AT is rendered in JST (UTC+9); convert to a true UTC instant to compare against "now".
    const generatedUtcMs = Date.UTC(y, mo - 1, d, h, mi) - 9 * 60 * 60 * 1000;
    return (Date.now() - generatedUtcMs) / 3600000;
  }

  const LAST_IDX = DATES.length - 1;
  // Preset ranges exclude "today" (index LAST_IDX) to match the Google Ads UI's own "last N
  // days" definition, which also excludes today. Confirmed with funato-san 2026-08-22.
  let rangeEnd = LAST_IDX - 1;
  let rangeStart = Math.max(0, rangeEnd - DEFAULT_PRESET_DAYS + 1);
  let activePresetDays = DEFAULT_PRESET_DAYS;

  function grade(roas){
    if (roas === null) return "g-none";
    if (roas >= ROAS_GOOD) return "g-good";
    if (roas >= ROAS_MID) return "g-mid";
    return "g-bad";
  }
  function yen(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }
  function pct(roas){ return roas === null ? "—" : roas.toFixed(1) + "%"; }
  function dateIndex(dateStr){ return DATES.indexOf(dateStr); }

  function aggregate(product, s, e){
    let cost = 0, cv = 0, value = 0;
    for (let i = s; i <= e; i++){
      cost += product.cost[i];
      cv += product.cv[i];
      value += product.value[i];
    }
    const roas = cost > 0 ? (value / cost * 100) : null;
    return { cost, cv, value, roas };
  }

  const root = document.getElementById("board-root");

  function renderBoard(){
    root.innerHTML = "";

    const startDate = DATES[rangeStart];
    const endDate = DATES[rangeEnd];
    const stats = products.map(p => ({ p, agg: aggregate(p, rangeStart, rangeEnd) }));

    // TRUE account-wide totals (ACCOUNT_COST/ACCOUNT_VALUE), not the sum of `stats` -- `stats`
    // only covers item_ids the pipeline could classify into a recognized AG/label, which
    // understates true spend by whatever runs under an unmapped label (see the audit-bar
    // warnings for which labels those are right now).
    let totalCost = 0, totalValue = 0;
    for (let i = rangeStart; i <= rangeEnd; i++){
      totalCost += ACCOUNT_COST[i] || 0;
      totalValue += ACCOUNT_VALUE[i] || 0;
    }
    const overallRoas = totalCost > 0 ? (totalValue/totalCost*100) : null;
    const overallRoasText = overallRoas === null ? "—" : overallRoas.toFixed(1);

    // 売上高広告費率 = ad cost / whole-store revenue (every order, every channel) -- distinct
    // from ROAS above, which only measures return on the ad spend itself against ad-attributed
    // value. Uses the same true totalCost computed above, over the same selected range.
    let totalShopSales = 0;
    for (let i = rangeStart; i <= rangeEnd; i++){
      totalShopSales += SHOP_SALES[i] || 0;
    }
    const adToSalesRatio = totalShopSales > 0 ? (totalCost / totalShopSales * 100) : null;
    const adToSalesText = adToSalesRatio === null ? "—" : adToSalesRatio.toFixed(1) + "%";

    // Which AG columns to show for THIS date range: only ones with actual spend in it, so a
    // paused campaign's pre-pause history still shows up when the range reaches back far enough,
    // instead of the whole AG silently vanishing the moment it gets paused.
    const agGroups = AG_ORDER.map(ag => {
      const items = stats.filter(x => x.p.ag === ag)
        .sort((a,b) => (b.agg.roas === null ? -1 : b.agg.roas) - (a.agg.roas === null ? -1 : a.agg.roas));
      const cost = items.reduce((s,x)=>s+x.agg.cost,0);
      const cv = items.reduce((s,x)=>s+x.agg.cv,0);
      const value = items.reduce((s,x)=>s+x.agg.value,0);
      // TRUE per-AG cost/CV/value/ROAS, from the asset_group resource (every surface the AG
      // serves on -- Search/Display/YouTube/etc, not just Shopping; see generate_board.py's
      // fetch_ag_daily_totals). Drives the header badge below. `cost`/`cv`/`value` above (product-
      // card sums, shopping_performance_view only) stay unchanged as the column-visibility filter
      // and the per-product breakdown -- the two totals can legitimately diverge (see footer note).
      let trueCost = 0, trueCv = 0, trueValue = 0;
      for (let i = rangeStart; i <= rangeEnd; i++){
        trueCost += (AG_COST[ag] || [])[i] || 0;
        trueCv += (AG_CV[ag] || [])[i] || 0;
        trueValue += (AG_VALUE[ag] || [])[i] || 0;
      }
      const agRoas = trueCost > 0 ? (trueValue/trueCost*100) : null;
      // How much of this AG's TRUE spend actually landed on Shopping surfaces (item_id-attributed,
      // shopping_performance_view) vs everywhere else PMax can serve (Search/Display/YouTube/
      // Discover/...). Added 2026-08-22: PMax gives no direct placement control, so a falling
      // shopping ratio is the earliest visible symptom of the same non-Shopping-surface takeover
      // that forced Gift-Scene's retirement (Discover clicks grew ~740x there before anyone
      // noticed) -- see the shopping-ratio audit banner below for the fixed-window early-warning
      // check on this same signal.
      //
      // Numerator fix (2026-08-23, funato-san verification): when several display AGs share one
      // raw asset_group (似顔絵/名入れ), `trueCost` is necessarily identical across all of them --
      // Google Ads has no per-label true-cost breakdown, only per-asset_group. Using just this
      // column's own label-split `cost` as the numerator against that shared, un-split
      // denominator mechanically halves (or worse) the ratio for every member of the group, which
      // was firing false "non-Shopping leakage" warnings for 似顔絵/名入れ even though their
      // combined ratio was a healthy ~91%. Fix: sum product-card cost across every display AG that
      // shares this raw AG, so the numerator and denominator describe the same real Ads entity.
      const rawAg = RAW_AG_OF[ag] || ag;
      const rawGroupCost = stats
        .filter(x => (RAW_AG_OF[x.p.ag] || x.p.ag) === rawAg)
        .reduce((s,x) => s + x.agg.cost, 0);
      const shoppingRatio = trueCost > 0 ? (rawGroupCost / trueCost * 100) : null;
      // "商品N件" counts only items that actually ran (cost>0) within the selected period, not
      // every product ever historically tied to this AG -- `items` itself stays unfiltered so
      // zero-activity products still render as "期間内データなし" cards further down the column.
      const activeCount = items.filter(x => x.agg.cost > 0).length;
      return { ag, rawAg, items, cost, cv, value, trueCost, trueCv, trueValue, agRoas, shoppingRatio, activeCount };
    });
    const agGroupsByAg = Object.fromEntries(agGroups.map(g => [g.ag, g]));

    // Groups display AGs by the real Google Ads asset group they share (see generate_board.py's
    // raw_ag_groups) -- most groups have exactly one display AG (unchanged rendering below), but
    // ベストセラー(似顔絵)/(名入れ) share ONE real asset group, so they render as a single true-AG
    // card with two リスティンググループ subsections instead of two duplicate-looking AG cards.
    // Currently-active groups first (left-to-right, top of the grid), paused ones after -- stable
    // sort keeps each group's original AG_DISPLAY_ORDER relative ordering intact.
    const shownRawGroups = RAW_AG_GROUPS
      .map(g => ({ raw: g.raw, displays: g.displays.filter(d => (agGroupsByAg[d.ag]?.cost || 0) > 0) }))
      .filter(g => g.displays.length > 0)
      .sort((a, b) => (AG_STATUS[b.displays[0].ag] === "ENABLED") - (AG_STATUS[a.displays[0].ag] === "ENABLED"));

    const shownAgNames = shownRawGroups.flatMap(g => g.displays.map(d => d.ag));
    const periodText = `${startDate}〜${endDate}／表示中${shownAgNames.length}AG（${shownAgNames.join("・") || "該当なし"}）・全${products.length}商品`;

    // Campaign-level tier, between the account-wide total and the per-AG columns: TRUE per-
    // campaign totals from CAMPAIGN_COST/CAMPAIGN_VALUE/CAMPAIGN_CV (every product actually
    // running under that campaign in Google Ads, independent of custom_label_0 classification --
    // see generate_board.py's fetch_campaign_daily_totals), not a sum of only the classified
    // products shown in the AG columns below. A product currently excluded from every AG's
    // targeting (e.g. custom_label_0="excluded") still counts here if it has real spend.
    const shownCampaignGroups = CAMPAIGN_ORDER.map(campaign => {
      let cost = 0, cv = 0, value = 0;
      for (let i = rangeStart; i <= rangeEnd; i++){
        cost += (CAMPAIGN_COST[campaign] || [])[i] || 0;
        cv += (CAMPAIGN_CV[campaign] || [])[i] || 0;
        value += (CAMPAIGN_VALUE[campaign] || [])[i] || 0;
      }
      return { campaign, cost, cv, value, roas: cost > 0 ? (value / cost * 100) : null };
    }).filter(g => g.cost > 0);

    // Nests each shown raw-AG group under its real parent CP (campaign), using RAW_AG_CAMPAIGN
    // (derived live, see generate_board.py's fetch_raw_ag_campaigns) instead of relying on the CP
    // row and the AG grid happening to line up -- they used to be two independently-ordered lists
    // with no structural relationship, which visibly misled (即納・ベストセラー, really under
    // Best-Selling, rendered directly below the unrelated Second-Team card). A raw AG with no
    // known CP (shouldn't happen given the account structure today, but stay safe against a future
    // gap) falls into a trailing unzoned group instead of being silently dropped.
    const zones = CAMPAIGN_ORDER.map(campaign => ({
      campaign,
      campaignStats: shownCampaignGroups.find(g => g.campaign === campaign) || null,
      rawGroups: shownRawGroups.filter(g => RAW_AG_CAMPAIGN[g.raw] === campaign),
    })).filter(z => z.rawGroups.length > 0);
    const zonedRaws = new Set(zones.flatMap(z => z.rawGroups.map(g => g.raw)));
    const unzonedRawGroups = shownRawGroups.filter(g => !zonedRaws.has(g.raw));
    if (unzonedRawGroups.length > 0){
      zones.push({ campaign: null, campaignStats: null, rawGroups: unzonedRawGroups });
    }

    const hero = document.createElement("div");
    hero.className = "hero-bar";
    hero.innerHTML = `
      <div class="hero-left">
        <div class="title">リスティンググループ商品ボード｜ももやま<span class="badge-auto">自動取得パイプライン</span></div>
        <div class="period">${periodText}</div>
        <div class="updated">最終更新：${GENERATED_AT}</div>
      </div>
      <div class="hero-right">
        <div class="hero-roas-label">全体ROAS</div>
        <div class="hero-roas-value">${overallRoasText}<span class="unit">%</span></div>
        <div class="hero-roas-sub">売上総額 ${yen(totalValue)}／広告費総額 ${yen(totalCost)}</div>
        <div class="hero-secondary">
          <span class="hero-secondary-label">売上高広告費率</span>
          <span class="hero-secondary-value">${adToSalesText}</span>
        </div>
      </div>
    `;
    root.appendChild(hero);

    const staleHours = hoursSinceGenerated();
    if (staleHours !== null && staleHours >= STALE_THRESHOLD_HOURS){
      const stale = document.createElement("div");
      stale.className = "stale-bar";
      const staleDaysText = staleHours >= 48 ? `約${Math.floor(staleHours/24)}日間` : `${Math.floor(staleHours)}時間`;
      stale.innerHTML = `⚠️ このボードは${staleDaysText}更新されていません（最終更新：${GENERATED_AT}）。自動更新が失敗している可能性があります。GitHub Actionsの実行状況を確認してください。`;
      root.appendChild(stale);
    }

    if (STRUCTURE_WARNINGS.length > 0){
      const escapeHtml = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const audit = document.createElement("div");
      audit.className = "audit-bar";
      audit.innerHTML = `⚠️ このボードが認識していないアカウント構造が見つかりました。表示に反映されていない可能性があります：<ul>${STRUCTURE_WARNINGS.map(w => `<li>${escapeHtml(w)}</li>`).join("")}</ul>`;
      root.appendChild(audit);
    }

    // Fixed 直近7日（当日を除く、Task 1と同じ定義）ウィンドウでのショッピング比率早期警告。
    // ユーザーが今どの期間ボタンを選んでいるかに関わらず常にこの固定ウィンドウでチェックする --
    // Gift-Sceneの前例（Discoverクリックが約740倍に膨らむまで誰も気づかなかった）を踏まえ、
    // 表示期間の選び方に依存せず毎回自動で兆候を拾うのが狙い（2026-08-22、ふなとさんと確定）。
    const shoppingWarnEnd = LAST_IDX - 1;
    const shoppingWarnStart = Math.max(0, shoppingWarnEnd - 6);
    const shoppingRatioWarnings = [];
    // Group by raw asset_group, not display AG: 似顔絵/名入れ share one raw AG and therefore one
    // real trueCost, so checking them separately with a per-label numerator both double-processes
    // the same true cost and mechanically halves each label's ratio -- see the same fix/rationale
    // on the per-column shoppingRatio above (2026-08-23, funato-san verification).
    const warnRawGroups = {};
    for (const displayAg of Object.keys(AG_COST)){
      const rawAg = RAW_AG_OF[displayAg] || displayAg;
      (warnRawGroups[rawAg] = warnRawGroups[rawAg] || []).push(displayAg);
    }
    for (const [warnRawAg, displayAgs] of Object.entries(warnRawGroups)){
      let warnTrueCost = 0, warnCardCost = 0;
      for (let i = shoppingWarnStart; i <= shoppingWarnEnd; i++){
        // identical across every displayAgs member by construction (see RAW_AG_OF) -- take the first
        warnTrueCost += (AG_COST[displayAgs[0]] || [])[i] || 0;
      }
      for (const p of products){
        if (!displayAgs.includes(p.ag)) continue;
        for (let i = shoppingWarnStart; i <= shoppingWarnEnd; i++){
          warnCardCost += p.cost[i] || 0;
        }
      }
      if (warnTrueCost <= 0) continue;
      const warnRatio = warnCardCost / warnTrueCost * 100;
      if (warnRatio < SHOPPING_RATIO_FLOOR){
        shoppingRatioWarnings.push({ ag: displayAgs.join("・"), ratio: warnRatio, trueCost: warnTrueCost });
      }
    }
    if (shoppingRatioWarnings.length > 0){
      const shopAudit = document.createElement("div");
      shopAudit.className = "audit-bar";
      shopAudit.innerHTML = `⚠️ 直近7日間（${DATES[shoppingWarnStart]}〜${DATES[shoppingWarnEnd]}）でショッピング比率が${SHOPPING_RATIO_FLOOR}%を下回っているAGがあります。Search/Display/YouTube/Discover等の非ショッピング面への流出が拡大している可能性があります：<ul>${shoppingRatioWarnings.map(w => `<li>${w.ag}：ショッピング比率${pct(w.ratio)}（直近7日の真の費用${yen(w.trueCost)}）</li>`).join("")}</ul>`;
      root.appendChild(shopAudit);
    }

    const notice = document.createElement("div");
    notice.className = "notice-bar";
    notice.innerHTML = `✅ 自動取得パイプライン：①Google Merchant Center(product_custom_label_0)で商品⇄AGラベルを取得 → ②Google Ads(item_id別・日別)で費用・コンバージョンを取得 → ③突合。毎朝自動更新。表示期間は下のボタンで自由に切り替え可能（データは直近${DATES.length}日分を保持）。各AG列は選択期間内に実績があるものだけを表示（現在の稼働状況は各列に表示）。`;
    root.appendChild(notice);

    const periodBar = document.createElement("div");
    periodBar.className = "period-bar";
    // 14日はLG（リスティンググループ）商品構成の入れ替えジャッジの主指標として2026-08-28追加
    // -- 週次サイクルを2周カバーし曜日変動を均せる一方、30/90日ほど直近の変化に鈍感にならない
    // （運用原則の詳細はNotion「ショッピング広告LGチューニング手順」参照）。
    const presets = [7, 14, 30, 90].filter(d => d <= DATES.length);
    periodBar.innerHTML = `
      <div class="period-presets">
        ${presets.map(d => `<button class="period-btn${activePresetDays===d ? ' active' : ''}" data-days="${d}">直近${d}日</button>`).join("")}
      </div>
      <div class="period-custom">
        <input type="date" id="range-start-input" min="${DATES[0]}" max="${DATES[LAST_IDX]}" value="${startDate}">
        <span>〜</span>
        <input type="date" id="range-end-input" min="${DATES[0]}" max="${DATES[LAST_IDX]}" value="${endDate}">
        <button id="range-apply-btn">適用</button>
      </div>
    `;
    root.appendChild(periodBar);

    periodBar.querySelectorAll(".period-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const days = parseInt(btn.dataset.days, 10);
        rangeEnd = LAST_IDX - 1;
        rangeStart = Math.max(0, rangeEnd - days + 1);
        activePresetDays = days;
        renderBoard();
      });
    });
    periodBar.querySelector("#range-apply-btn").addEventListener("click", () => {
      const sVal = periodBar.querySelector("#range-start-input").value;
      const eVal = periodBar.querySelector("#range-end-input").value;
      let sIdx = dateIndex(sVal);
      let eIdx = dateIndex(eVal);
      if (sIdx === -1 || eIdx === -1){
        alert(`日付は${DATES[0]}〜${DATES[LAST_IDX]}の範囲で選択してください。`);
        return;
      }
      if (sIdx > eIdx){ [sIdx, eIdx] = [eIdx, sIdx]; }
      rangeStart = sIdx;
      rangeEnd = eIdx;
      activePresetDays = null;
      renderBoard();
    });

    const legend = document.createElement("div");
    legend.className = "legend-bar";
    legend.innerHTML = `
      <span><span class="legend-dot" style="background:#2e9e5b;"></span>ROAS ${ROAS_GOOD}%以上（基準達成）</span>
      <span><span class="legend-dot" style="background:#d99a1f;"></span>${ROAS_MID}〜${ROAS_GOOD-1}%</span>
      <span><span class="legend-dot" style="background:#d64545;"></span>${ROAS_MID}%未満（入替候補）</span>
      <span><span class="legend-dot" style="background:#adaba3;"></span>期間内データなし</span>
    `;
    root.appendChild(legend);

    if (shownRawGroups.length === 0){
      const empty = document.createElement("div");
      empty.className = "notice-bar";
      empty.innerHTML = "選択した期間には実績のあるAGがありません。期間を広げてお試しください。";
      root.appendChild(empty);
    }

    function renderItemCards(container, items){
      items.forEach(({p, agg}) => {
        const card = document.createElement("div");
        card.className = "card " + grade(agg.roas);
        card.title = p.title;
        const thumb = p.img ? `<img class="card-thumb" src="${p.img}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="card-thumb"></div>`;
        let targetingBadge = "";
        if (p.currentAg == null) {
          targetingBadge = `<span class="targeting-badge targeting-excluded">✕ 現在は配信対象外</span>`;
        } else if (p.currentAg !== p.ag) {
          targetingBadge = `<span class="targeting-badge targeting-moved">↳ 現在は「${p.currentAg}」で配信中</span>`;
        }
        card.innerHTML = `
          <div class="card-thumb-wrap">
            ${thumb}
            <span class="roas-badge roas-badge-thumb ${grade(agg.roas)}">${pct(agg.roas)}</span>
          </div>
          <div class="card-body">
            ${targetingBadge}
            <div class="card-title">${p.title}</div>
            <div class="card-id">${p.id}</div>
            <div class="card-stats-secondary">
              <span class="stat-chip"><span class="stat-label">費用</span>${yen(agg.cost)}</span>
              <span class="stat-chip"><span class="stat-label">CV</span>${agg.cv.toFixed(1)}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function agHeaderHtml(name, isEnabled, trueCost, trueCv, agRoas, shoppingRatio, extraMetric){
      return `
        <div class="ag-name">AG：${name}<span class="ag-status ${isEnabled ? 'ag-status-on' : 'ag-status-off'}">${isEnabled ? '現在稼働中' : '現在一時停止中'}</span></div>
        <div class="ag-metrics">
          <span class="roas-badge small ${grade(agRoas)}">${pct(agRoas)}</span>
          <span>費用 ${yen(trueCost)}</span>
          <span>CV ${trueCv.toFixed(1)}</span>
          ${extraMetric}
          <span class="${shoppingRatio !== null && shoppingRatio < SHOPPING_RATIO_FLOOR ? 'metric-warn' : ''}" title="商品カード合計費用 ÷ このAGの真の費用（asset_group実績）。低いほどSearch/Display/YouTube/Discover等の非ショッピング面に費用が流れている">商品データ広告：${pct(shoppingRatio)}</span>
        </div>
      `;
    }

    function buildRawGroupCol({ raw, displays }){
      const col = document.createElement("div");

      if (displays.length === 1){
        // Common case: this raw AG has exactly one display column -- unchanged from before.
        const g = agGroupsByAg[displays[0].ag];
        col.className = "ag-col";
        const isEnabled = AG_STATUS[g.ag] === "ENABLED";
        const header = document.createElement("div");
        header.className = "ag-header";
        header.innerHTML = agHeaderHtml(g.ag, isEnabled, g.trueCost, g.trueCv, g.agRoas, g.shoppingRatio, `<span>商品 ${g.activeCount}件</span>`);
        col.appendChild(header);

        const cardsWrap = document.createElement("div");
        cardsWrap.className = "ag-cards";
        renderItemCards(cardsWrap, g.items);
        col.appendChild(cardsWrap);
      } else {
        // Multiple display AGs share ONE real Google Ads asset group (currently only ベストセラー's
        // 似顔絵/名入れ split) -- one outer card carries the true AG-level badges (identical across
        // the shared displays by construction, see agGroups above), broken into per-リスティング
        // グループ subsections below for the product-level breakdown. Replaces what used to be
        // duplicate-looking AG cards with identical numbers (2026-08-22, ふなとさん確認).
        col.className = "ag-col ag-col-wide";
        const first = agGroupsByAg[displays[0].ag];
        const isEnabled = AG_STATUS[displays[0].ag] === "ENABLED";
        const header = document.createElement("div");
        header.className = "ag-header";
        header.innerHTML = agHeaderHtml(raw, isEnabled, first.trueCost, first.trueCv, first.agRoas, first.shoppingRatio, "");
        col.appendChild(header);

        const listingGroups = document.createElement("div");
        listingGroups.className = "listing-groups";
        displays.forEach(({ ag, sublabel }) => {
          const g = agGroupsByAg[ag];
          const lg = document.createElement("div");
          lg.className = "listing-group";
          lg.innerHTML = `
            <div class="listing-group-name">LG：${sublabel || ag}</div>
            <div class="listing-group-count">商品 ${g.activeCount}件</div>
          `;
          const lgCards = document.createElement("div");
          lgCards.className = "ag-cards";
          renderItemCards(lgCards, g.items);
          lg.appendChild(lgCards);
          listingGroups.appendChild(lg);
        });
        col.appendChild(listingGroups);
      }

      return col;
    }

    // One CP zone per campaign that has a shown raw AG, each containing only the AG columns that
    // really belong to it (see the `zones` computation above) -- structurally guarantees the
    // CP↔AG relationship instead of relying on two independently-ordered layouts lining up by
    // coincidence.
    zones.forEach(({ campaign, campaignStats, rawGroups }) => {
      const zoneBody = document.createElement("div");
      zoneBody.className = "board-grid";
      rawGroups.forEach(g => zoneBody.appendChild(buildRawGroupCol(g)));

      if (campaign === null){
        // No known CP mapping for this raw AG (shouldn't happen given the account structure
        // today) -- render its columns unzoned rather than inventing a fake CP label.
        root.appendChild(zoneBody);
        return;
      }

      const zone = document.createElement("div");
      zone.className = "zone " + grade(campaignStats ? campaignStats.roas : null);
      const zoneHeader = document.createElement("div");
      zoneHeader.className = "zone-header";
      zoneHeader.innerHTML = campaignStats ? `
        <span class="zone-title">CP：${campaign}</span>
        <span class="zone-metrics">
          <span class="roas-badge cp ${grade(campaignStats.roas)}">${pct(campaignStats.roas)}</span>
          <span>費用 ${yen(campaignStats.cost)}</span>
          <span>CV ${campaignStats.cv.toFixed(1)}</span>
        </span>
      ` : `<span class="zone-title">CP：${campaign}</span>`;
      zone.appendChild(zoneHeader);
      zone.appendChild(zoneBody);
      root.appendChild(zone);
    });

    // 「未広告・要検討」TOP10: products with real Shopify sales in the selected range whose ad
    // cost in that SAME range is ~0 (see OPPORTUNITY_AD_COST_FLOOR/build_opportunity_products) --
    // 広告ではないルートで売れている商品を認知し、広告投入することでパフォーマンスを上げられるの
    // ではないか、という仮説（2026-08-31、ふなとさん）の検証材料。Recomputed per period preset
    // just like everything else on the board, not a fixed window.
    const opportunityCandidates = OPPORTUNITY_PRODUCTS.map(p => {
      let qty = 0, revenue = 0, adCost = 0;
      for (let i = rangeStart; i <= rangeEnd; i++){
        qty += p.qty[i] || 0;
        revenue += p.revenue[i] || 0;
        adCost += p.adCost[i] || 0;
      }
      return { p, qty, revenue, adCost };
    })
      .filter(x => x.qty > 0 && x.adCost < OPPORTUNITY_AD_COST_FLOOR)
      .sort((a, b) => b.qty - a.qty)
      .slice(0, 10);

    if (opportunityCandidates.length > 0){
      const opp = document.createElement("div");
      opp.className = "opp-section";
      opp.innerHTML = `
        <div class="opp-header">
          <span class="opp-title">🔍 未広告・要検討 TOP10</span>
          <span class="opp-badge">数量ベース・${startDate}〜${endDate}</span>
        </div>
        <p class="opp-desc">対象期間中の広告費が実質ゼロ（¥${OPPORTUNITY_AD_COST_FLOOR}未満）にもかかわらず、ももやま本店全体では販売数量の多い商品です。広告未実施のまま売れている＝LGへの新規投入候補、または既存LGからの除外・除外解除の判断材料になります。</p>
        <div class="opp-grid"></div>
      `;
      const oppGrid = opp.querySelector(".opp-grid");
      opportunityCandidates.forEach(({ p, qty, revenue }, i) => {
        const card = document.createElement("div");
        card.className = "opp-card";
        const thumb = p.img ? `<img class="opp-thumb" src="${p.img}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="opp-thumb"></div>`;
        card.innerHTML = `
          <div class="opp-thumb-wrap">
            ${thumb}
            <span class="opp-rank">${i + 1}</span>
          </div>
          <div class="opp-body">
            <div class="opp-qty">${qty}<span class="unit">個</span></div>
            <div class="opp-title-text" title="${p.title}">${p.title}</div>
            <div class="opp-stats">
              <span class="opp-chip"><span class="stat-label">売上</span>${yen(revenue)}</span>
            </div>
            <span class="opp-reason">${p.reason}</span>
          </div>
        `;
        oppGrid.appendChild(card);
      });
      root.appendChild(opp);
    }

    const foot = document.createElement("div");
    foot.className = "footnote";
    foot.innerHTML = `データソース：Google Ads API（asset_group_status／campaign_status／item_id別・日別実績／campaign別実績）・Google Merchant API（product_custom_label_0）・Shopify Admin API（本店全体の売上高・商品別注文明細）に直接接続（直近${DATES.length}日分を保持）。基準線${ROAS_GOOD}%は新規顧客優先入札ボーナス除去後の本来実力ROASの下限値（Search/Shopping面）。最終取得：${GENERATED_AT}。AG見出しの費用とカード内訳の合計は、検索・ディスプレイ等の非商品広告費用分だけ一致しない場合があります。ベストセラー(似顔絵)／(名入れ)の「商品データ広告」比率は、両者がGoogle広告上は同一AGのため、商品カード費用を両列合算した値を分母（asset_group実績）に対して計算しています。`;
    root.appendChild(foot);
  }

  renderBoard();
})();
