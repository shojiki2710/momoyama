    background: #ffffff;
    max-width: 1240px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  .hero-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 20px 24px;
    margin-bottom: 10px;

    color: #fff;
  }
  .hero-left .title { font-weight: 700; font-size: 18px; opacity: 0.85; margin-bottom: 4px; }
  .hero-left .period { font-size: 12px; opacity: 0.6; }
  .badge-auto {
    display: inline-block;
    margin-left: 8px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    vertical-align: middle;
  }
  .hero-right { text-align: right; }
  .hero-roas-label { font-size: 11.5px; opacity: 0.75; letter-spacing: 0.03em; margin-bottom: 2px; }
  .hero-roas-value { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
  .hero-roas-value .unit { font-size: 22px; font-weight: 700; margin-left: 2px; }
  .hero-roas-sub { font-size: 11.5px; opacity: 0.65; margin-top: 4px; }
  .below-target { color: #ff8a80; }
  .above-target { color: #8affa0; }
  .notice-bar {
    font-size: 11px;
    color: #4a6b3a;
    background: #f0f7ea;
    border: 1px solid #cfe6bc;
    border-radius: 10px;
    padding: 8px 14px;
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .stale-bar {
    font-size: 12px;
    font-weight: 700;
    color: #7a2a1c;
    background: #fdecea;
    border: 1px solid #f3b7ab;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .audit-bar {
    font-size: 12px;
    font-weight: 700;
    color: #7a5a12;
    background: #fdf3e0;
    border: 1px solid #f0d798;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .audit-bar ul { margin: 4px 0 0; padding-left: 18px; font-weight: 500; }

    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .period-presets { display: flex; gap: 6px; }
  .period-btn {

    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.12);
    background: #f4f3ef;
    color: #4a4a4a;
    cursor: pointer;
    font-family: inherit;
  }
  .period-btn.active { background: #2b3142; color: #fff; border-color: #2b3142; }
  .period-custom {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #6b6b6b;
  }
  .period-custom input[type="date"] {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.15);
    font-family: inherit;
    color: #1a1a1a;
  }
  .period-custom button {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    border: none;
    background: #1f2430;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .legend-bar {

    gap: 16px;
    font-size: 12px;
    align-items: center;
    padding: 8px 4px 16px;
    flex-wrap: wrap;
  }

    font-weight: 700;
    font-size: 12.5px;

  .g-mid  { background: #d99a1f; }
  .g-bad  { background: #d64545; }
  .g-none { background: #adaba3; }
  .card {

    border-radius: 10px;
    padding: 10px;

    const agGroups = AG_ORDER.map(ag => {
      const items = stats.filter(x => x.p.ag === ag)
        .sort((a,b) => (b.agg.roas === null ? -1 : b.agg.roas) - (a.agg.roas === null ? -1 : a.agg.roas));
      const cost = items.reduce((s,x)=>s+x.agg.cost,0);
      const cv = items.reduce((s,x)=>s+x.agg.cv,0);
      const value = items.reduce((s,x)=>s+x.agg.value,0);
      const agRoas = cost > 0 ? (value/cost*100) : null;
      return { ag, items, cost, cv, value, agRoas };
    });
    // Currently-active AGs first (left-to-right, top of the grid), paused ones after -- stable
    // sort keeps each group's original AG_DISPLAY_ORDER relative ordering intact.
    const shownAgGroups = agGroups
      .filter(g => g.cost > 0)
      .sort((a, b) => (AG_STATUS[b.ag] === "ENABLED") - (AG_STATUS[a.ag] === "ENABLED"));

    const periodText = `${startDate}〜${endDate}／表示中${shownAgGroups.length}AG（${shownAgGroups.map(g=>g.ag).join("・") || "該当なし"}）・全${products.length}商品`;

    const hero = document.createElement("div");
    hero.className = "hero-bar";
    hero.innerHTML = `
      <div class="hero-left">
        <div class="title">リスティンググループ商品ボード｜ももやま<span class="badge-auto">自動取得パイプライン</span></div>
        <div class="period">${periodText}</div>
      </div>
      <div class="hero-right">
        <div class="hero-roas-label">全体ROAS</div>
        <div class="hero-roas-value">${overallRoasText}<span class="unit">%</span></div>
        <div class="hero-roas-sub ${belowTarget ? 'below-target' : 'above-target'}">基準${ROAS_GOOD}%${belowTarget ? 'に対し未達' : '以上を達成'}</div>
      </div>
    `;
    root.appendChild(hero);

    const staleHours = hoursSinceGenerated();
    if (staleHours !== null && staleHours >= STALE_THRESHOLD_HOURS){
      const stale = document.createElement("div");
      stale.className = "stale-bar";
      const staleDaysText = staleHours >= 48 ? `約${Math.floor(staleHours/24)}日間` : `${Math.floor(staleHours)}時間`;
      stale.innerHTML = `⚠️ このボードは${staleDaysText}更新されていません（最終更新：${GENERATED_AT}）。自動更新が失敗している可能性があります。GitHub Actionsの実行状況を確認してください。`;
      root.appendChild(stale);
    }

    if (STRUCTURE_WARNINGS.length > 0){
      const escapeHtml = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const audit = document.createElement("div");
      audit.className = "audit-bar";
      audit.innerHTML = `⚠️ このボードが認識していないアカウント構造が見つかりました。表示に反映されていない可能性があります：<ul>${STRUCTURE_WARNINGS.map(w => `<li>${escapeHtml(w)}</li>`).join("")}</ul>`;
      root.appendChild(audit);
    }

    const notice = document.createElement("div");
    notice.className = "notice-bar";
    notice.innerHTML = `✅ 自動取得パイプライン：①Google Merchant Center(product_custom_label_0)で商品⇄AGラベルを取得 → ②Google Ads(item_id別・日別)で費用・コンバージョンを取得 → ③突合。毎朝自動更新（最終更新：${GENERATED_AT}）。表示期間は下のボタンで自由に切り替え可能（データは直近${DATES.length}日分を保持）。各AG列は選択期間内に実績があるものだけを表示（現在の稼働状況は各列に表示）。`;
    root.appendChild(notice);

    const periodBar = document.createElement("div");
    periodBar.className = "period-bar";
    const presets = [7, 30, 90].filter(d => d <= DATES.length);
    periodBar.innerHTML = `
      <div class="period-presets">
        ${presets.map(d => `<button class="period-btn${activePresetDays===d ? ' active' : ''}" data-days="${d}">直近${d}日</button>`).join("")}
      </div>
      <div class="period-custom">
        <input type="date" id="range-start-input" min="${DATES[0]}" max="${DATES[LAST_IDX]}" value="${startDate}">
        <span>〜</span>
        <input type="date" id="range-end-input" min="${DATES[0]}" max="${DATES[LAST_IDX]}" value="${endDate}">
        <button id="range-apply-btn">適用</button>
      </div>
    `;
    root.appendChild(periodBar);

    periodBar.querySelectorAll(".period-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const days = parseInt(btn.dataset.days, 10);
        rangeEnd = LAST_IDX;
        rangeStart = Math.max(0, LAST_IDX - days + 1);
        activePresetDays = days;
        renderBoard();
      });
    });
    periodBar.querySelector("#range-apply-btn").addEventListener("click", () => {
      const sVal = periodBar.querySelector("#range-start-input").value;
      const eVal = periodBar.querySelector("#range-end-input").value;
      let sIdx = dateIndex(sVal);
      let eIdx = dateIndex(eVal);
      if (sIdx === -1 || eIdx === -1){
        alert(`日付は${DATES[0]}〜${DATES[LAST_IDX]}の範囲で選択してください。`);
        return;
      }
      if (sIdx > eIdx){ [sIdx, eIdx] = [eIdx, sIdx]; }
      rangeStart = sIdx;
      rangeEnd = eIdx;
      activePresetDays = null;
      renderBoard();
    });

    const legend = document.createElement("div");
    legend.className = "legend-bar";
    legend.innerHTML = `
      <span><span class="legend-dot" style="background:#2e9e5b;"></span>ROAS ${ROAS_GOOD}%以上（基準達成）</span>
      <span><span class="legend-dot" style="background:#d99a1f;"></span>${ROAS_MID}〜${ROAS_GOOD-1}%</span>
      <span><span class="legend-dot" style="background:#d64545;"></span>${ROAS_MID}%未満（入替候補）</span>
      <span><span class="legend-dot" style="background:#adaba3;"></span>期間内データなし</span>
    `;
    root.appendChild(legend);

    const grid = document.createElement("div");
    grid.className = "board-grid";

    if (shownAgGroups.length === 0){
      const empty = document.createElement("div");
      empty.className = "notice-bar";
      empty.innerHTML = "選択した期間には実績のあるAGがありません。期間を広げてお試しください。";
      root.appendChild(empty);
    }

    shownAgGroups.forEach(({ag, items, cost, cv, value, agRoas}) => {
      const col = document.createElement("div");
      col.className = "ag-col";

      const isEnabled = AG_STATUS[ag] === "ENABLED";
      const header = document.createElement("div");
      header.className = "ag-header";
      header.innerHTML = `
        <div class="ag-name">${ag}<span class="ag-status ${isEnabled ? 'ag-status-on' : 'ag-status-off'}">${isEnabled ? '現在稼働中' : '現在一時停止中'}</span></div>
        <div class="ag-metrics">
          <span class="roas-badge small ${grade(agRoas)}">${pct(agRoas)}</span>
          <span>費用 ${yen(cost)}</span>
          <span>CV ${cv.toFixed(1)}</span>
          <span>商品 ${items.length}件</span>
        </div>
      `;
      col.appendChild(header);

      items.forEach(({p, agg}) => {
        const card = document.createElement("div");
        card.className = "card " + grade(agg.roas);
        card.title = p.title;
        const thumb = p.img ? `<img class="card-thumb" src="${p.img}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="card-thumb"></div>`;
        card.innerHTML = `
          <div class="card-thumb-wrap">
            ${thumb}
            <span class="roas-badge roas-badge-thumb ${grade(agg.roas)}">${pct(agg.roas)}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-id">${p.id}</div>
            <div class="card-stats-secondary">
              <span class="stat-chip"><span class="stat-label">費用</span>${yen(agg.cost)}</span>
              <span class="stat-chip"><span class="stat-label">CV</span>${agg.cv.toFixed(1)}</span>
            </div>
          </div>
        `;
        col.appendChild(card);
      });

      grid.appendChild(col);
    });

    root.appendChild(grid);

    const foot = document.createElement("div");
    foot.className = "footnote";
    foot.innerHTML = `データソース：Windsor.ai経由（google_ads: asset_group_status／google_merchant: product_custom_label_0／google_ads: item_id別・日別実績、直近${DATES.length}日分を保持）。基準線${ROAS_GOOD}%は新規顧客優先入札ボーナス除去後の本来実力ROASの下限値（Search/Shopping面）。最終取得：${GENERATED_AT}。`;
    root.appendChild(foot);
  }

  renderBoard();
})();
</script>
</body>
</html>
