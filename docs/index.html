<style>
  * { box-sizing: border-box; }
  body {

    background: #ffffff;
    max-width: 1240px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  .hero-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 20px 24px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #1f2430, #2b3142);
    border-radius: 16px;
    color: #fff;
  }
  .hero-left .title { font-weight: 700; font-size: 18px; opacity: 0.85; margin-bottom: 4px; }
  .hero-left .period { font-size: 12px; opacity: 0.6; }
  .badge-auto {
    display: inline-block;
    margin-left: 8px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    vertical-align: middle;
  }
  .hero-right { text-align: right; }
  .hero-roas-label { font-size: 11.5px; opacity: 0.75; letter-spacing: 0.03em; margin-bottom: 2px; }
  .hero-roas-value { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
  .hero-roas-value .unit { font-size: 22px; font-weight: 700; margin-left: 2px; }
  .hero-roas-sub { font-size: 11.5px; opacity: 0.65; margin-top: 4px; }
  .below-target { color: #ff8a80; }
  .above-target { color: #8affa0; }
  .notice-bar {
    font-size: 11px;
    color: #4a6b3a;
    background: #f0f7ea;
    border: 1px solid #cfe6bc;
    border-radius: 10px;
    padding: 8px 14px;
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .stale-bar {
    font-size: 12px;
    font-weight: 700;
    color: #7a2a1c;
    background: #fdecea;
    border: 1px solid #f3b7ab;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .period-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .period-presets { display: flex; gap: 6px; }
  .period-btn {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.12);
    background: #f4f3ef;
    color: #4a4a4a;
    cursor: pointer;
    font-family: inherit;
  }
  .period-btn.active { background: #2b3142; color: #fff; border-color: #2b3142; }
  .period-custom {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #6b6b6b;
  }
  .period-custom input[type="date"] {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.15);
    font-family: inherit;
    color: #1a1a1a;
  }
  .period-custom button {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    border: none;
    background: #1f2430;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .legend-bar {
    display: flex;
    gap: 16px;
    font-size: 12px;
    align-items: center;
    padding: 8px 4px 16px;
    flex-wrap: wrap;
  }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .board-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(230px, 1fr));
    gap: 14px;
  }

    .board-grid { grid-template-columns: repeat(2, 1fr); }
  }

    background: #f7f6f2;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .ag-header {
    padding: 4px 4px 10px 4px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    margin-bottom: 2px;
  }
  .ag-name { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .ag-metrics { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #6b6b6b; flex-wrap: wrap; white-space: nowrap; }
  .roas-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12.5px;

  .g-mid  { background: #d99a1f; }
  .g-bad  { background: #d64545; }
  .g-none { background: #adaba3; }
  .card {

    border-radius: 10px;
    padding: 10px;

    border-left: 4px solid transparent;

  .card.g-bad  { border-left-color: #d64545; background: rgba(214,69,69,0.07); }

    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex: none;
    width: 76px;
  }
  .card-thumb {

    height: 76px;
    border-radius: 9px;
    object-fit: cover;
    background: #eee;
    display: block;
  }
  .roas-badge-thumb {
    font-size: 12.5px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 12px;
    line-height: 1.4;
    font-weight: 600;
    margin-bottom: 5px;
  }
  .card-id {
    font-size: 9.5px;
    color: #9a9a9a;
    font-family: ui-monospace, SFMono-Regular, monospace;
    margin-bottom: 6px;

    padding: 2px 8px;

    font-size: 9.5px;

  }
  .footnote {
    margin-top: 18px;
    font-size: 11.5px;
    color: #9a9a9a;
    line-height: 1.7;
