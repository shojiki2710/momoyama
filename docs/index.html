<title>リスティンググループ商品ボード｜ももやま</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: #1a1a1a;
    background: #ffffff;
    max-width: 1240px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  .hero-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 20px 24px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #1f2430, #2b3142);
    border-radius: 16px;
    color: #fff;
  }
  .hero-left .title { font-weight: 700; font-size: 18px; opacity: 0.85; margin-bottom: 4px; }
  .hero-left .period { font-size: 12px; opacity: 0.6; }
  .badge-auto {
    display: inline-block;
    margin-left: 8px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    vertical-align: middle;
  }
  .hero-right { text-align: right; }
  .hero-roas-label { font-size: 11.5px; opacity: 0.75; letter-spacing: 0.03em; margin-bottom: 2px; }
  .hero-roas-value { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
  .hero-roas-value .unit { font-size: 22px; font-weight: 700; margin-left: 2px; }
  .hero-roas-sub { font-size: 11.5px; opacity: 0.65; margin-top: 4px; }
  .below-target { color: #ff8a80; }
  .above-target { color: #8affa0; }
  .notice-bar {
    font-size: 11px;
    color: #4a6b3a;
    background: #f0f7ea;
    border: 1px solid #cfe6bc;
    border-radius: 10px;
    padding: 8px 14px;
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .period-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .period-presets { display: flex; gap: 6px; }
  .period-btn {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.12);
    background: #f4f3ef;
    color: #4a4a4a;
    cursor: pointer;
    font-family: inherit;
  }
  .period-btn.active { background: #2b3142; color: #fff; border-color: #2b3142; }
  .period-custom {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #6b6b6b;
  }
  .period-custom input[type="date"] {
    font-size: 12px;
    padding: 5px 8px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,0.15);
    font-family: inherit;
    color: #1a1a1a;
  }
  .period-custom button {
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    border: none;
    background: #1f2430;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .legend-bar {
    display: flex;
    gap: 16px;
    font-size: 12px;
    align-items: center;
    padding: 8px 4px 16px;
    flex-wrap: wrap;
  }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .board-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(230px, 1fr));
    gap: 14px;
  }
  @media (max-width: 950px) {
    .board-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .ag-col {
    background: #f7f6f2;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .ag-header {
    padding: 4px 4px 10px 4px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    margin-bottom: 2px;
  }
  .ag-name { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .ag-metrics { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #6b6b6b; flex-wrap: wrap; white-space: nowrap; }
  .roas-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12.5px;
    color: #fff;
  }
  .roas-badge.small { font-size: 13px; padding: 3px 10px; }
  .g-good { background: #2e9e5b; }
  .g-mid  { background: #d99a1f; }
  .g-bad  { background: #d64545; }
  .g-none { background: #adaba3; }
  .card {
    background: #ffffff;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.07);
    border-left: 4px solid transparent;
    display: flex;
    gap: 9px;

  .card.g-good { border-left-color: #2e9e5b; background: rgba(46,158,91,0.06); }
  .card.g-mid  { border-left-color: #d99a1f; background: rgba(217,154,31,0.06); }
  .card.g-bad  { border-left-color: #d64545; background: rgba(214,69,69,0.07); }
  .card.g-none { border-left-color: #adaba3; background: rgba(0,0,0,0.02); }
  .card-thumb-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex: none;
    width: 76px;
  }
  .card-thumb {
    width: 76px;
    height: 76px;
    border-radius: 9px;
    object-fit: cover;
    background: #eee;
    display: block;
  }
  .roas-badge-thumb {
    font-size: 12.5px;
    padding: 3px 10px;
    white-space: nowrap;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 12px;
    line-height: 1.4;
    font-weight: 600;
    margin-bottom: 5px;
  }
  .card-id {
    font-size: 9.5px;
    color: #9a9a9a;
    font-family: ui-monospace, SFMono-Regular, monospace;
    margin-bottom: 6px;
    word-break: break-all;
  }
  .card-stats-secondary {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .stat-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 3px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.1);
    font-size: 11px;
    font-weight: 700;
    color: #4d5449;
    white-space: nowrap;
  }
  .stat-chip .stat-label {
    font-weight: 500;
    font-size: 9.5px;
    color: #8a8f84;
  }
  .footnote {
    margin-top: 18px;
    font-size: 11.5px;
    color: #9a9a9a;
    line-height: 1.7;
  }
</style>

  const ROAS_GOOD = 400;
  const ROAS_MID = 300;
  const DEFAULT_PRESET_DAYS = 30;

  const LAST_IDX = DATES.length - 1;
  let rangeStart = Math.max(0, DATES.length - DEFAULT_PRESET_DAYS);
  let rangeEnd = LAST_IDX;
  let activePresetDays = DEFAULT_PRESET_DAYS;

  function grade(roas){
    if (roas === null) return "g-none";
    if (roas >= ROAS_GOOD) return "g-good";
    if (roas >= ROAS_MID) return "g-mid";
    return "g-bad";
  }

  function pct(roas){ return roas === null ? "—" : roas.toFixed(1) + "%"; }
  function dateIndex(dateStr){ return DATES.indexOf(dateStr); }

  function aggregate(product, s, e){
    let cost = 0, cv = 0, value = 0;
    for (let i = s; i <= e; i++){
      cost += product.cost[i];
      cv += product.cv[i];
      value += product.value[i];
    }
    const roas = cost > 0 ? (value / cost * 100) : null;
    return { cost, cv, value, roas };
  }

  const root = document.getElementById("board-root");

  function renderBoard(){
    root.innerHTML = "";

    const startDate = DATES[rangeStart];
    const endDate = DATES[rangeEnd];
    const stats = products.map(p => ({ p, agg: aggregate(p, rangeStart, rangeEnd) }));

    const totalCost = stats.reduce((s,x)=>s+x.agg.cost,0);
    const totalValue = stats.reduce((s,x)=>s+x.agg.value,0);
    const overallRoas = totalCost > 0 ? (totalValue/totalCost*100) : null;
    const overallRoasText = overallRoas === null ? "—" : overallRoas.toFixed(1);
    const belowTarget = overallRoas === null || overallRoas < ROAS_GOOD;

    const presentAgCount = new Set(products.map(p=>p.ag)).size;
    const periodText = `${startDate}〜${endDate}／稼働中${presentAgCount}AG（${AG_ORDER.join("・")}）・全${products.length}商品`;

    hero.className = "hero-bar";
    hero.innerHTML = `

        <div class="title">リスティンググループ商品ボード｜ももやま<span class="badge-auto">自動取得パイプライン</span></div>
        <div class="period">${periodText}</div>
      </div>
      <div class="hero-right">
        <div class="hero-roas-label">全体ROAS</div>
        <div class="hero-roas-value">${overallRoasText}<span class="unit">%</span></div>
        <div class="hero-roas-sub ${belowTarget ? 'below-target' : 'above-target'}">基準${ROAS_GOOD}%${belowTarget ? 'に対し未達' : '以上を達成'}</div>
      </div>
    `;
    root.appendChild(hero);

    const notice = document.createElement("div");
    notice.className = "notice-bar";
    notice.innerHTML = `✅ 自動取得パイプライン：①Google Ads(asset_group_status)で稼働中AGを特定 → ②Google Merchant Center(product_custom_label_0)で現在の商品⇄AGラベルを取得 → ③Google Ads(item_id別・日別)で費用・コンバージョンを取得 → ④突合。毎朝自動更新（最終更新：${GENERATED_AT}）。表示期間は下のボタンで自由に切り替え可能（データは直近${DATES.length}日分を保持）。`;
    root.appendChild(notice);

    const periodBar = document.createElement("div");
    periodBar.className = "period-bar";
    const presets = [7, 30, 90].filter(d => d <= DATES.length);

        <span>〜</span>
        <input type="date" id="range-end-input" min="${DATES[0]}" max="${DATES[LAST_IDX]}" value="${endDate}">

      </div>
    `;
    root.appendChild(periodBar);

    periodBar.querySelectorAll(".period-btn").forEach(btn => {

        const days = parseInt(btn.dataset.days, 10);

        rangeStart = Math.max(0, LAST_IDX - days + 1);
        activePresetDays = days;
        renderBoard();

      const eVal = periodBar.querySelector("#range-end-input").value;
      let sIdx = dateIndex(sVal);
      let eIdx = dateIndex(eVal);
      if (sIdx === -1 || eIdx === -1){
        alert(`日付は${DATES[0]}〜${DATES[LAST_IDX]}の範囲で選択してください。`);
        return;

      if (sIdx > eIdx){ [sIdx, eIdx] = [eIdx, sIdx]; }

      rangeEnd = eIdx;
      activePresetDays = null;
      renderBoard();
    });

    legend.innerHTML = `

      <span><span class="legend-dot" style="background:#d64545;"></span>${ROAS_MID}%未満（入替候補）</span>
      <span><span class="legend-dot" style="background:#adaba3;"></span>期間内データなし</span>
    `;
    root.appendChild(legend);

    const grid = document.createElement("div");
    grid.className = "board-grid";

    AG_ORDER.forEach(ag => {
      const items = stats.filter(x => x.p.ag === ag)
        .sort((a,b) => (b.agg.roas === null ? -1 : b.agg.roas) - (a.agg.roas === null ? -1 : a.agg.roas));
      const cost = items.reduce((s,x)=>s+x.agg.cost,0);
      const cv = items.reduce((s,x)=>s+x.agg.cv,0);
      const value = items.reduce((s,x)=>s+x.agg.value,0);
      const agRoas = cost > 0 ? (value/cost*100) : null;

      const col = document.createElement("div");
      col.className = "ag-col";

      const header = document.createElement("div");
      header.className = "ag-header";
      header.innerHTML = `
        <div class="ag-name">${ag}</div>
        <div class="ag-metrics">
          <span class="roas-badge small ${grade(agRoas)}">${pct(agRoas)}</span>
          <span>費用 ${yen(cost)}</span>
          <span>CV ${cv.toFixed(1)}</span>
          <span>商品 ${items.length}件</span>
        </div>

      col.appendChild(header);

      items.forEach(({p, agg}) => {
        const card = document.createElement("div");
        card.className = "card " + grade(agg.roas);
        card.title = p.title;
        const thumb = p.img ? `<img class="card-thumb" src="${p.img}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="card-thumb"></div>`;

            <span class="roas-badge roas-badge-thumb ${grade(agg.roas)}">${pct(agg.roas)}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${p.title}</div>
            <div class="card-id">${p.id}</div>
            <div class="card-stats-secondary">
              <span class="stat-chip"><span class="stat-label">費用</span>${yen(agg.cost)}</span>
              <span class="stat-chip"><span class="stat-label">CV</span>${agg.cv.toFixed(1)}</span>
            </div>
          </div>
        `;
        col.appendChild(card);
      });

      grid.appendChild(col);
    });

    root.appendChild(grid);

    const foot = document.createElement("div");
    foot.className = "footnote";
    foot.innerHTML = `データソース：Windsor.ai経由（google_ads: asset_group_status／google_merchant: product_custom_label_0／google_ads: item_id別・日別実績、直近${DATES.length}日分を保持）。基準線${ROAS_GOOD}%は新規顧客優先入札ボーナス除去後の本来実力ROASの下限値（Search/Shopping面）。最終取得：${GENERATED_AT}。`;
    root.appendChild(foot);
  }

  renderBoard();
})();
