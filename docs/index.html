<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>リスティンググループ商品ボード｜ももやま</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: #1a1a1a;
    background: #ffffff;
    max-width: 1240px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  .hero-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    padding: 20px 24px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #1f2430, #2b3142);
    border-radius: 16px;
    color: #fff;
  }
  .hero-left .title { font-weight: 700; font-size: 18px; opacity: 0.85; margin-bottom: 4px; }
  .hero-left .period { font-size: 12px; opacity: 0.6; }
  .badge-auto {
    display: inline-block;
    margin-left: 8px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    vertical-align: middle;
  }
  .hero-right { text-align: right; }
  .hero-roas-label { font-size: 11.5px; opacity: 0.75; letter-spacing: 0.03em; margin-bottom: 2px; }
  .hero-roas-value { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.01em; }
  .hero-roas-value .unit { font-size: 22px; font-weight: 700; margin-left: 2px; }
  .hero-roas-sub { font-size: 11.5px; opacity: 0.65; margin-top: 4px; }
  .below-target { color: #ff8a80; }
  .above-target { color: #8affa0; }
  .notice-bar {
    font-size: 11px;
    color: #4a6b3a;
    background: #f0f7ea;
    border: 1px solid #cfe6bc;
    border-radius: 10px;
    padding: 8px 14px;
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .legend-bar {
    display: flex;
    gap: 16px;
    font-size: 12px;
    align-items: center;
    padding: 8px 4px 16px;
    flex-wrap: wrap;
  }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .board-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(230px, 1fr));
    gap: 14px;
  }
  @media (max-width: 950px) {
    .board-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .ag-col {
    background: #f7f6f2;
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .ag-header {
    padding: 4px 4px 10px 4px;
    border-bottom: 1px solid rgba(0,0,0,0.08);
    margin-bottom: 2px;
  }
  .ag-name { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .ag-metrics { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: #6b6b6b; flex-wrap: wrap; }
  .roas-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12.5px;
    color: #fff;
  }
  .roas-badge.small { font-size: 11.5px; padding: 2px 8px; }
  .g-good { background: #2e9e5b; }
  .g-mid  { background: #d99a1f; }
  .g-bad  { background: #d64545; }
  .card {
    background: #ffffff;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.07);
    border-left: 4px solid transparent;
    display: flex;
    gap: 9px;
  }
  .card.g-good { border-left-color: #2e9e5b; background: rgba(46,158,91,0.06); }
  .card.g-mid  { border-left-color: #d99a1f; background: rgba(217,154,31,0.06); }
  .card.g-bad  { border-left-color: #d64545; background: rgba(214,69,69,0.07); }
  .card-thumb {
    width: 52px;
    height: 52px;
    flex: none;
    border-radius: 8px;
    object-fit: cover;
    background: #eee;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-title {
    font-size: 12px;
    line-height: 1.4;
    font-weight: 600;
    margin-bottom: 5px;
  }
  .card-id {
    font-size: 9.5px;
    color: #9a9a9a;
    font-family: ui-monospace, SFMono-Regular, monospace;
    margin-bottom: 5px;
    word-break: break-all;
  }
  .card-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #6b6b6b;
    gap: 6px;
  }
  .card-stats .roas-badge { font-size: 12.5px; flex: none; }
  .footnote {
    margin-top: 18px;
    font-size: 11.5px;
    color: #9a9a9a;
    line-height: 1.7;
  }
</style>
</head>

  const PERIOD_TEXT = "2026-06-29〜2026-07-28／稼働中4AG（還暦祝い・誕生日祝い・Best-Selling(似顔絵)・Best-Selling(名入れ)）・全16商品";
  const GENERATED_AT = "2026-07-28 15:59 JST";
  const ROAS_GOOD = 420;
  const ROAS_MID = 300;

  function grade(roas){
    if (roas >= ROAS_GOOD) return "g-good";
    if (roas >= ROAS_MID) return "g-mid";
    return "g-bad";
  }
  function yen(n){ return "¥" + Math.round(n).toLocaleString("ja-JP"); }

  const root = document.getElementById("board-root");

  const totalCost = products.reduce((s,p)=>s+p.cost,0);
  const totalValue = products.reduce((s,p)=>s+p.value,0);
  const overallRoas = (totalCost > 0 ? (totalValue/totalCost*100) : 0).toFixed(1);
  const belowTarget = Number(overallRoas) < ROAS_GOOD;

  const hero = document.createElement("div");
  hero.className = "hero-bar";
  hero.innerHTML = `
    <div class="hero-left">
      <div class="title">リスティンググループ商品ボード｜ももやま<span class="badge-auto">自動取得パイプライン</span></div>
      <div class="period">${PERIOD_TEXT}</div>
    </div>
    <div class="hero-right">
      <div class="hero-roas-label">全体ROAS</div>
      <div class="hero-roas-value">${overallRoas}<span class="unit">%</span></div>
      <div class="hero-roas-sub ${belowTarget ? 'below-target' : 'above-target'}">基準${ROAS_GOOD}%${belowTarget ? 'に対し未達' : '以上を達成'}</div>
    </div>
  `;
  root.appendChild(hero);

  const notice = document.createElement("div");
  notice.className = "notice-bar";
  notice.innerHTML = `✅ 自動取得パイプライン：①Google Ads(asset_group_status)で稼働中AGを特定 → ②Google Merchant Center(product_custom_label_0)で現在の商品⇄AGラベルを取得 → ③Google Ads(item_id別)で費用・コンバージョンを取得 → ④突合。毎朝自動更新（最終更新：${GENERATED_AT}）。`;
  root.appendChild(notice);

  const legend = document.createElement("div");
  legend.className = "legend-bar";
  legend.innerHTML = `
    <span><span class="legend-dot" style="background:#2e9e5b;"></span>ROAS ${ROAS_GOOD}%以上（基準達成）</span>
    <span><span class="legend-dot" style="background:#d99a1f;"></span>${ROAS_MID}〜${ROAS_GOOD-1}%</span>
    <span><span class="legend-dot" style="background:#d64545;"></span>${ROAS_MID}%未満（入替候補）</span>
  `;
  root.appendChild(legend);

  const grid = document.createElement("div");
  grid.className = "board-grid";

  AG_ORDER.forEach(ag => {
    const items = products.filter(p => p.ag === ag).sort((a,b)=> b.roas - a.roas);
    const cost = items.reduce((s,p)=>s+p.cost,0);
    const cv = items.reduce((s,p)=>s+p.cv,0);
    const value = items.reduce((s,p)=>s+p.value,0);
    const agRoas = (cost > 0 ? (value/cost*100) : 0).toFixed(1);

    const col = document.createElement("div");
    col.className = "ag-col";

    const header = document.createElement("div");
    header.className = "ag-header";
    header.innerHTML = `
      <div class="ag-name">${ag}</div>
      <div class="ag-metrics">
        <span class="roas-badge small ${grade(agRoas)}">${agRoas}%</span>
        <span>費用 ${yen(cost)}</span>
        <span>CV ${cv.toFixed(1)}</span>
        <span>商品 ${items.length}件</span>
      </div>
    `;
    col.appendChild(header);

    items.forEach(p => {
      const card = document.createElement("div");
      card.className = "card " + grade(p.roas);
      card.title = p.title;
      const thumb = p.img ? `<img class="card-thumb" src="${p.img}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<div class="card-thumb"></div>`;
      card.innerHTML = `
        ${thumb}
        <div class="card-body">
          <div class="card-title">${p.title}</div>
          <div class="card-id">${p.id}</div>
          <div class="card-stats">
            <span>費用 ${yen(p.cost)} ／ CV ${p.cv.toFixed(1)}</span>
            <span class="roas-badge ${grade(p.roas)}">${p.roas.toFixed(1)}%</span>
          </div>
        </div>
      `;
      col.appendChild(card);
    });

    grid.appendChild(col);
  });

  root.appendChild(grid);

  const foot = document.createElement("div");
  foot.className = "footnote";
  foot.innerHTML = `データソース：Windsor.ai経由（google_ads: asset_group_status／google_merchant: product_custom_label_0／google_ads: item_id別実績、直近30日）。基準線${ROAS_GOOD}%は新規顧客優先入札ボーナス除去後の本来実力ROASの下限値（Search/Shopping面）。最終取得：${GENERATED_AT}。`;
  root.appendChild(foot);
})();
</script>
