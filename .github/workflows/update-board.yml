name: Update listing group board

on:
  schedule:
    # GitHub Actions' scheduled-run delay for this repo isn't a fixed offset -- it depends on
    # which UTC time-of-day is requested (global queue congestion varies by hour). Requesting
    # 22:07 UTC consistently landed ~9h43m late (measured 2026-07-30 through 08-06); switching
    # to 12:24 UTC dropped that to ~1h53m-3h09m (measured 2026-08-07/08). Two runs/day added
    # 2026-08-21, spaced 12h apart -- actual landing times for each will vary independently and
    # aren't guaranteed to land near any specific clock time. Re-measure via the Actions run
    # history (event=="schedule" runs) if timing drifts enough to matter again.
    - cron: "24 12 * * *"
    - cron: "24 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate board
        env:
          ADS_DEVELOPER_TOKEN: ${{ secrets.ADS_DEVELOPER_TOKEN }}
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_LOGIN_CUSTOMER_ID: ${{ secrets.ADS_LOGIN_CUSTOMER_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python scripts/generate_board.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to the board."
          else
            git commit -m "chore: update listing group board"
            git push
          fi
