name: Update listing group board

on:
  schedule:
    # 22:07 UTC == 07:07 JST. Offset a few minutes past the hour on purpose --
    # GitHub Actions explicitly documents top-of-the-hour schedules as more likely
    # to be delayed or dropped under load (confirmed happened on 2026-07-29's 0-minute run).
    - cron: "7 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate board
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/generate_board.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to the board."
          else
            git commit -m "chore: update listing group board"
            git push
          fi
