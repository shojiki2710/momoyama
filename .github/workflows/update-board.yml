name: Update listing group board

on:
  schedule:
    # Compensating for an observed, remarkably consistent ~9h43m scheduling delay on this repo
    # (measured across 6 scheduled runs 2026-07-30 through 2026-08-06: actual firing landed
    # 9h30m-9h54m after the requested time, every single day -- not occasional flakiness, a
    # steady offset). Requesting 12:24 UTC (21:24 JST) so the ~9h43m delay lands actual execution
    # near 07:07 JST, the original target. Empirical workaround, not a real fix -- if GitHub's
    # delay behavior changes, this offset will need re-tuning. Re-measure via the Actions run
    # history (event=="schedule" runs) if the board stops updating near morning JST again.
    - cron: "24 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate board
        env:
          ADS_DEVELOPER_TOKEN: ${{ secrets.ADS_DEVELOPER_TOKEN }}
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_LOGIN_CUSTOMER_ID: ${{ secrets.ADS_LOGIN_CUSTOMER_ID }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python scripts/generate_board.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to the board."
          else
            git commit -m "chore: update listing group board"
            git push
          fi
